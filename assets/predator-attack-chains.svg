<svg xmlns="http://www.w3.org/2000/svg" width="704" height="174" viewBox="0 0 704 174" role="img" aria-labelledby="title description">
  <title id="title">Predator: 359 modeled attack chains</title>
  <desc id="description">A compact dark card showing 359 modeled attack chains across MITRE ATT&amp;CK Enterprise tactics, plus an AI injection area. A mission's actual coverage is set by scope.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141923"/>
      <stop offset="0.6" stop-color="#10141c"/>
      <stop offset="1" stop-color="#1b1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8362"/>
      <stop offset="1" stop-color="#f04459"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="90%">
      <stop offset="0" stop-color="#75302d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#75302d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect x="1" y="1" width="702" height="172" rx="12"/></clipPath>
  </defs>
  <rect x="1" y="1" width="702" height="172" rx="12" fill="url(#panel)" stroke="#623536" stroke-width="1.5"/>
  <g clip-path="url(#round)">
    <rect x="1" y="1" width="702" height="172" fill="url(#glow)"/>
    <path d="M0 0h704" stroke="url(#accent)" stroke-width="4"/>
    <path d="M492 2 704 121M553 1l151 84M622 1l82 45" stroke="#f97563" stroke-opacity="0.08"/>
    <circle cx="650" cy="66" r="48" fill="none" stroke="#f97563" stroke-opacity="0.12"/>
    <circle cx="650" cy="66" r="25" fill="none" stroke="#f97563" stroke-opacity="0.12"/>
    <circle cx="650" cy="66" r="4" fill="#f97563" fill-opacity="0.35"/>
    <path d="M212 62v65" stroke="#674146" stroke-opacity="0.7"/>
    <path d="M36 140h632" stroke="#674146" stroke-opacity="0.7"/>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <text x="36" y="30" fill="#ff8872" font-size="11" font-weight="700" letter-spacing="2.5">PREDATOR / MITRE ATT&amp;CK</text>
    <text x="35" y="120" fill="url(#accent)" font-size="82" font-weight="750" letter-spacing="-5">359</text>
    <text x="238" y="85" fill="#f5f3f3" font-size="24" font-weight="700" letter-spacing="-0.7">Modeled attack chains</text>
    <text x="239" y="110" fill="#b7b9c1" font-size="13">Threat paths for focused CVE investigation</text>
    <text x="37" y="158" fill="#dad7d9" font-size="11.5" font-weight="600">14 Enterprise tactics</text>
    <circle cx="225" cy="154" r="2" fill="#ff806a"/>
    <text x="239" y="158" fill="#dad7d9" font-size="11.5" font-weight="600">AI injection area</text>
    <circle cx="407" cy="154" r="2" fill="#ff806a"/>
    <text x="421" y="158" fill="#a5a9b4" font-size="11.5">Coverage follows the agreed scope</text>
  </g>
</svg>
